name: Build mt7981

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      Cache:
        description: 'Using cache to speed up OpenWrt compilation.'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REPO_URL: https://github.com/wdhysrz/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: mt7981.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  DEVICE_NAME: mt7981
  FIRMWARE: ImmortalWrt-firmware

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check Server Performance
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限, 若选择的插件过多, 务必注意CPU分配的!"
          echo -e "已知CPU型号(降序): 7763, 8370c, 8272CL, 8171M, E5-2673\n"
          echo "--------------------------------CPU信息--------------------------------"
          echo "CPU物理数量:$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU核心数量: $(nproc)"
          echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
          echo "--------------------------------内存信息--------------------------------"
          echo -e "已安装内存详细信息:"
          echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
          echo "--------------------------------硬盘信息--------------------------------"
          echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -1)" && df -hT

      - name: Optimize Disk Space
        uses: hugo1h/disk-space-optimizer@v0.8
        with:
          operate_sudo: "True"
          general_include: .+
          general_exclude: |-
            ^GCCS
            ^G\+\+$
            Clang
            LLVM
          docker_include: ".+"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          homebrew_prune: "True"
          homebrew_clean: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -y
          sudo -E apt-get full-upgrade -y
          sudo -E apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libreadline-dev libssl-dev \
          libtool lld lldb lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
          python3-ply python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get autoremove --purge -y
          sudo -E apt-get clean -y
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone -b $REPO_BRANCH --depth=1 $REPO_URL ImmortalWrt
          ln -sf /workdir/ImmortalWrt $GITHUB_WORKSPACE/ImmortalWrt

      - name: Cache Toolchain
        uses: HiGarfield/cachewrtbuild@main
        if: ${{ github.event.inputs.Cache == 'true' }}
        with:
          ccache: true
          clean: false
          mixkey: aarch64
          prefix: ${{ github.workspace }}/ImmortalWrt

      - name: Load custom feeds (DIY_P1_SH)
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF ImmortalWrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd ImmortalWrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd ImmortalWrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd ImmortalWrt && ./scripts/feeds install -a

      - name: Load custom configuration (DIY_P2_SH)
        run: |
          [ -e files ] && mv files ImmortalWrt/files
          chmod +x $DIY_P2_SH
          cd ImmortalWrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        id: package
        run: |
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE ImmortalWrt/.config
          cd ImmortalWrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd ImmortalWrt
          echo "::group::Compile Log"
          echo -e "jobs: $(nproc) thread compile"
          # 先尝试高并发编译，失败则降级为单线程并输出详细日志
          make -j$(($(nproc)+1)) || make -j1 V=s
          echo "::endgroup::"
          echo "status=success" >> $GITHUB_OUTPUT
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: ${{ !cancelled() }}
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' && !cancelled() }}
        with:
          name: ImmortalWrt-bins-${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
          path: ImmortalWrt/bin

      - name: Organize files
        id: organize
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          cd ImmortalWrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: ${{ env.FIRMWARE }}-${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: ${{ env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "### HanWckf's ImmortalWrt mt7981 Release $(date +"%Y.%m.%d-%H:%M")" >> release.txt
          echo "factory bin" >> release.txt
          echo "360T7-md5: $(md5sum ${{ env.FIRMWARE }}/*360-t7*factory.bin | cut -d" " -f1)" >> release.txt
          echo "sysupgrade bin" >> release.txt
          echo "360T7-sha256: $(grep "360-t7" ${{ env.FIRMWARE }}/sha256sums | cut -d" " -f1)" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag.outputs.status == 'success' && !cancelled() }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE }}/*360-t7*factory.bin
            ${{ env.FIRMWARE }}/*360-t7*sysupgrade.bin

      - name: Prune Old Releases and Workflows
        uses: ghactions-deliveries/delete-releases@main
        if: ${{ env.UPLOAD_RELEASE == 'true' && !cancelled() }}
        with:
          delete_releases: true
          delete_tags: true
          delete_older_than: 5days
          delete_workflows: true
          workflow_runs_keep: 5
          github_token: ${{ secrets.GITHUB_TOKEN }}
