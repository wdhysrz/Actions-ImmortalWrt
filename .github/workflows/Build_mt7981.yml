name: Build mt7981

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      Cache:
        description: 'Using cache to speed up OpenWrt compilation.'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REPO_URL: https://github.com/shiyu1314/immortalwrt-mt798x-6.12
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: mt7981.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check Server Performance
        run: |
          echo "分配的服务器性能有限，请酌情选择插件"
          echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU核心数量: $(nproc)"
          echo "CPU型号信息: $(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')"
          echo "内存信息: $(sudo lshw -short -C memory | grep GiB || echo 'N/A')"
          echo "硬盘信息: $(ls /dev/sd* | grep -v '[1-9]' | wc -l) 块"
          df -hT

      - name: Optimize Disk Space
        uses: hugoalh/disk-space-optimizer-ghaction@v0.8
        with:
          operate_sudo: "True"
          general_include: "*"
          general_exclude: |
            nodejs
            selenium
            clang
            lua
          docker_include: "*"
          docker_prune: "True"
          docker_clean: "True"
          apt_prune: "True"
          apt_clean: "True"
          npm_prune: "True"
          npm_clean: "True"
          os_swap: "True"

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -y
          sudo -E apt-get full-upgrade -y
          sudo -E apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev \
            libssl-dev libtool lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 \
            python3 python3-pip python3-ply python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get -y clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone -b $REPO_BRANCH --depth=1 $REPO_URL ImmortalWrt
          ln -sf /workdir/ImmortalWrt $GITHUB_WORKSPACE/ImmortalWrt

      - name: Load custom feeds (DIY_P1_SH)
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF ImmortalWrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd ImmortalWrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd ImmortalWrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd ImmortalWrt && ./scripts/feeds install -a

      - name: Load custom configuration (DIY_P2_SH)
        run: |
          [ -e files ] && mv files ImmortalWrt/files
          chmod +x $DIY_P2_SH
          cd ImmortalWrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        id: package
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE ImmortalWrt/.config
          cd ImmortalWrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: List generated files (debug)
        run: |
          echo "=== Checking if firmware was generated ==="
          find ImmortalWrt/bin -name "*.itb" -o -name "*.bin" 2>/dev/null || echo "No firmware found yet"
          ls -la ImmortalWrt/bin/targets/ || true

      - name: Compile the firmware
        id: compile
        run: |
          cd ImmortalWrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "DEVICE_NAME=.mt7981" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: always()
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: ImmortalWrt_bins${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ImmortalWrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd ImmortalWrt/bin/targets/mediatek/filogic || exit 1
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          ls -la

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ImmortalWrt_firmwares${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "## ImmortalWrt mt7981 360T7 Release $(date +"%Y.%m.%d-%H%M")" >> release.txt
          echo "- factory.bin" >> release.txt
          echo "  360T7-md5: $(md5sum ${{ env.FIRMWARE }}/*360-t7*factory.bin | cut -d' ' -f1)" >> release.txt
          echo "- squashfs-sysupgrade.bin" >> release.txt
          echo "  360T7-md5: $(md5sum ${{ env.FIRMWARE }}/*360-t7*sysupgrade.bin | cut -d' ' -f1)" >> release.txt
          echo "  360T7-sha256: $(grep '.*360-t7.*sysupgrade.bin' ${{ env.FIRMWARE }}/sha256sums | grep -oE '\w{64}')" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT
          cp ImmortalWrt/.config ImmortalWrt/build.config

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: |
            ${{ env.FIRMWARE }}/*360-t7*factory.bin
            ${{ env.FIRMWARE }}/*360-t7*sysupgrade.bin
            ImmortalWrt/build.config

      - name: Remove old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          delete_releases: true
          releases_keep_latest: 5
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 10
          gh_token: ${{ github.token }}